<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ไม่พบหน้านี้ — flukesociety.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#241C14" />
    <style>
      /* หน้านี้ตั้งใจให้เป็น HTML ล้วนไม่พึ่งไฟล์อื่น จะได้แสดงได้แม้ไฟล์ของเว็บหลักหาย */
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #F6EFE1; color: #241C14;
        background-image: radial-gradient(rgba(36,28,20,0.18) 1.4px, rgba(36,28,20,0) 1.5px);
        background-size: 20px 20px;
        font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif;
      }
      main {
        max-width: 440px; width: 100%; background: #FFFFFF; border: 3px solid #241C14;
        border-radius: 20px; box-shadow: 7px 7px 0 #241C14; padding: 32px 28px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.2em; color: #6B5A48; }
      h1 { margin: 0; font-family: 'Kanit', 'Trebuchet MS', sans-serif; font-weight: 900; font-size: 30px; line-height: 1.35; }
      p { margin: 0; line-height: 1.85; color: #3B2E22; }
      a {
        align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px;
        background: #6C4AF6; color: #FFFFFF; border: 3px solid #241C14; border-radius: 14px;
        box-shadow: 5px 5px 0 #241C14; font-weight: 700; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #241C14; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="code">404 — NOT FOUND</span>
      <h1>ไม่พบหน้านี้</h1>
      <p>ลิงก์อาจพิมพ์ผิด หรือหน้านี้ถูกย้ายไปแล้ว เนื้อหาทั้งหมดของเว็บอยู่ในหน้าแรกหน้าเดียว</p>
      <a href="/">กลับหน้าแรก</a>
    </main>
  </body>
</html>
